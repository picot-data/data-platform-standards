<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" font-family="Segoe UI, Arial, sans-serif" class="dp-diagram" role="img" aria-label="Left: one standards repository that every entity mono-repo links to, plus three shared repos (Terraform module, CI workflow, entity template) referenced by each entity repo. Right: the minimal CI pipeline every entity repository runs on each push and pull request.">

  <rect width="960" height="630" fill="#ffffff"/>

  <defs>
    <marker id="rp-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L9,5.5 L0,10 z" fill="#5b6570"/>
    </marker>
    <marker id="rp-arrow-link" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,5 L0,9 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <text x="480" y="32" font-size="19" font-weight="bold" text-anchor="middle" fill="#003f5c">Repositories and Delivery</text>
  <text x="480" y="54" font-size="11.5" text-anchor="middle" fill="#666">Left: repository topology. Right: the minimal CI pipeline every entity repository runs.</text>

  <!-- LEFT PANEL: repository topology -->
  <rect x="30" y="100" width="570" height="500" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="315" y="124" font-size="13" font-weight="bold" text-anchor="middle" fill="#555">Repository topology</text>

  <g class="dp-node" data-href="index.md">
    <title>Group-wide rules and ADRs only — no entity-specific code or data. Every entity repository links here rather than copying.</title>
    <rect x="180" y="150" width="270" height="65" rx="6" fill="#ee4631"/>
    <text x="315" y="178" font-size="13" font-weight="bold" text-anchor="middle" fill="white">data-platform-standards</text>
    <text x="315" y="198" font-size="10.5" text-anchor="middle" fill="#fee2e2">naming, tagging, ADRs, glossary</text>
  </g>

  <path d="M125,300 L235,217" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#rp-arrow-link)"/>
  <path d="M305,300 L315,217" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#rp-arrow-link)"/>
  <path d="M485,300 L395,217" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#rp-arrow-link)"/>

  <rect x="248" y="245" width="134" height="20" fill="#f9fafb"/>
  <text x="315" y="259" font-size="10.5" font-style="italic" text-anchor="middle" fill="#888">links to, never copies</text>

  <g class="dp-node" data-href="repositories-and-delivery.md#entity-mono-repo-structure">
    <title>Today's POC repository. Disposable in the sense of "not promoted to production as-is", but written with production discipline. See "Entity mono-repo structure".</title>
    <rect x="45" y="300" width="160" height="65" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
    <text x="125" y="327" font-size="11" font-weight="bold" text-anchor="middle" fill="#0d47a1">poc-data-platform-dti</text>
    <text x="125" y="346" font-size="9.5" text-anchor="middle" fill="#1565c0">disposable POC repo</text>
  </g>

  <g class="dp-node" data-href="onboarding-a-new-entity.md#5-data-platform-code-new-entity-mono-repo">
    <title>Future production repository for Dirickx. The POC's solid parts are ported here — the POC repo is not promoted by renaming its remote.</title>
    <rect x="225" y="300" width="160" height="65" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="305" y="327" font-size="11" font-weight="bold" text-anchor="middle" fill="#555">data-platform-dti</text>
    <text x="305" y="346" font-size="9.5" text-anchor="middle" fill="#777">(future) production repo</text>
  </g>

  <g class="dp-node" data-href="onboarding-a-new-entity.md">
    <title>Future production repository for any new entity — same template, no reorganization needed. See "Onboarding a new entity".</title>
    <rect x="405" y="300" width="160" height="65" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="485" y="327" font-size="11" font-weight="bold" text-anchor="middle" fill="#555">data-platform-&lt;code&gt;</text>
    <text x="485" y="346" font-size="9.5" text-anchor="middle" fill="#777">(future) entity bg — B&amp;G, etc.</text>
  </g>

  <text x="305" y="383" font-size="10.5" font-style="italic" text-anchor="middle" fill="#888">each entity repo references, never copies:</text>

  <g class="dp-node" data-href="repositories-and-delivery.md#three-shared-repos-deduplicated-once-not-per-entity">
    <title>Two Terraform modules — entity (resource group, VM, NSG, Key Vault) and governance (tags, budgets) — consumed by infra/terraform/ as a root module pinned to a tagged ref. See ADR 0011.</title>
    <rect x="45" y="393" width="160" height="52" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="125" y="415" font-size="10" font-weight="bold" text-anchor="middle" fill="#4c1d95">terraform-azure-</text>
    <text x="125" y="428" font-size="10" font-weight="bold" text-anchor="middle" fill="#4c1d95">data-platform</text>
    <text x="125" y="440" font-size="9" text-anchor="middle" fill="#6d28d9">module, pinned by ref</text>
  </g>

  <g class="dp-node" data-href="repositories-and-delivery.md#three-shared-repos-deduplicated-once-not-per-entity">
    <title>The reusable CI workflow (lint, dbt parse, dbt build --target dev), called by each entity's ci.yml via workflow_call. See ADR 0011.</title>
    <rect x="225" y="393" width="160" height="52" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="305" y="415" font-size="10" font-weight="bold" text-anchor="middle" fill="#4c1d95">data-platform-</text>
    <text x="305" y="428" font-size="10" font-weight="bold" text-anchor="middle" fill="#4c1d95">workflows</text>
    <text x="305" y="440" font-size="9" text-anchor="middle" fill="#6d28d9">reusable CI, called via uses:</text>
  </g>

  <g class="dp-node" data-href="repositories-and-delivery.md#three-shared-repos-deduplicated-once-not-per-entity">
    <title>The mono-repo skeleton as a GitHub template repository — used once via "Use this template", not kept in sync afterward. See ADR 0011.</title>
    <rect x="405" y="393" width="160" height="52" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="485" y="415" font-size="10" font-weight="bold" text-anchor="middle" fill="#4c1d95">data-platform-</text>
    <text x="485" y="428" font-size="10" font-weight="bold" text-anchor="middle" fill="#4c1d95">entity-template</text>
    <text x="485" y="440" font-size="9" text-anchor="middle" fill="#6d28d9">GitHub template, copied once</text>
  </g>

  <g class="dp-node" data-href="repositories-and-delivery.md#why-one-repo-per-entity-not-one-mega-mono-repo-for-the-whole-group">
    <title>Ingestion, dbt, orchestration and Terraform live together, per entity. Splitting by component only pays off with independent per-component release cadences. See "Why one repo per entity".</title>
    <rect x="45" y="463" width="520" height="115" rx="6" fill="#ffffff" stroke="#1976d2" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="305" y="487" font-size="12" font-weight="bold" text-anchor="middle" fill="#0d47a1">Inside each entity repo: one mono-repo</text>
    <text x="305" y="510" font-size="10.5" text-anchor="middle" fill="#555">ingestion/ · transformation/ (dbt) · orchestration/ (Dagster) · infra/ (Terraform)</text>
    <text x="305" y="530" font-size="10.5" text-anchor="middle" fill="#555">A schema change in ingestion and its dbt impact are one commit, not synchronized PRs</text>
    <text x="305" y="557" font-size="9.5" font-style="italic" text-anchor="middle" fill="#888">Split by entity (own subscription, own access), not split by component</text>
  </g>

  <!-- RIGHT PANEL: CI pipeline -->
  <rect x="620" y="100" width="310" height="500" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="775" y="124" font-size="13" font-weight="bold" text-anchor="middle" fill="#555">Minimal CI (ci.yml)</text>

  <g class="dp-node" data-href="repositories-and-delivery.md#branching">
    <title>Every push and every pull request triggers the pipeline. feature/ and fix/ branches merge into develop; develop merges into main when ready to deploy.</title>
    <rect x="640" y="150" width="270" height="50" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
    <text x="775" y="180" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0d47a1">push / pull request</text>
  </g>

  <line x1="775" y1="200" x2="775" y2="228" stroke="#5b6570" stroke-width="2" marker-end="url(#rp-arrow)"/>

  <g class="dp-node" data-href="repositories-and-delivery.md#minimal-cicd">
    <title>Lints Python and SQL/dbt style before anything runs against data.</title>
    <rect x="640" y="228" width="270" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="775" y="258" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">lint</text>
  </g>

  <line x1="775" y1="278" x2="775" y2="306" stroke="#5b6570" stroke-width="2" marker-end="url(#rp-arrow)"/>

  <g class="dp-node" data-href="repositories-and-delivery.md#minimal-cicd">
    <title>"Does it compile?" — catches syntax and reference errors without touching any data.</title>
    <rect x="640" y="306" width="270" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="775" y="336" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">dbt parse</text>
  </g>

  <line x1="775" y1="356" x2="775" y2="384" stroke="#5b6570" stroke-width="2" marker-end="url(#rp-arrow)"/>

  <g class="dp-node" data-href="onboarding-an-engineer.md#2-local-dev-setup-about-20-minutes">
    <title>"Does it work on data?" — runs the models and their tests against dev data: a local DuckDB file, no cloud resources.</title>
    <rect x="640" y="384" width="270" height="50" rx="6" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.5"/>
    <text x="775" y="414" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#312e81">dbt build --target dev</text>
  </g>

  <line x1="775" y1="434" x2="775" y2="462" stroke="#5b6570" stroke-width="2" marker-end="url(#rp-arrow)"/>

  <g class="dp-node" data-href="repositories-and-delivery.md#minimal-cicd">
    <title>Optional for a single-owner platform — but if it is not built, it must be documented as "not implemented" rather than left ambiguous. Never a half-working pipeline that looks automated and silently isn't.</title>
    <rect x="640" y="462" width="270" height="50" rx="6" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="775" y="485" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#78350f">deploy to VM (deploy.yml)</text>
    <text x="775" y="502" font-size="10" text-anchor="middle" fill="#92400e">optional — documented either way</text>
  </g>
</svg>
