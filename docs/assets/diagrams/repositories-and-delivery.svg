<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" font-family="Segoe UI, Arial, sans-serif" class="dp-diagram">

  <rect width="1400" height="560" fill="#ffffff"/>

  <text x="700" y="32" font-size="22" font-weight="bold" text-anchor="middle" fill="#003f5c">Repositories and Delivery</text>
  <text x="700" y="53" font-size="12.5" text-anchor="middle" fill="#666">Left: repository topology. Right: the minimal CI/CD pipeline every entity repo runs.</text>

  <defs>
    <marker id="arrow-repo" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
    <marker id="arrow-repo-link" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- LEFT PANEL: repo topology -->
  <rect x="20" y="80" width="660" height="460" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="350" y="106" font-size="14" font-weight="bold" text-anchor="middle" fill="#555">Repository topology</text>

  <g class="dp-node" data-href="index.md">
    <title>Group-wide rules and ADRs only — no entity-specific code or data. Every entity repo links here rather than copying.</title>
    <rect x="180" y="130" width="340" height="70" rx="6" fill="#ee4631"/>
    <text x="350" y="160" font-size="13" font-weight="bold" text-anchor="middle" fill="white">data-platform-standards</text>
    <text x="350" y="178" font-size="10.5" text-anchor="middle" fill="#fee2e2">naming, tagging, ADRs, glossary</text>
  </g>

  <g class="dp-node" data-href="repositories-and-delivery.md#entity-mono-repo-structure">
    <title>Disposable POC repo — jetable in the sense of "not promoted to prod as-is", but coded with production discipline. See "Entity mono-repo structure".</title>
    <rect x="50" y="280" width="180" height="65" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
    <text x="140" y="308" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0d47a1">poc-data-platform-dti</text>
    <text x="140" y="325" font-size="9.5" text-anchor="middle" fill="#1565c0">disposable POC repo</text>
  </g>

  <g class="dp-node" data-href="onboarding-a-new-entity.md">
    <title>Future production repo for Dirickx — the POC's solid parts are ported here, not migrated by renaming the remote.</title>
    <rect x="260" y="280" width="180" height="65" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="350" y="308" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#555">data-platform-dti</text>
    <text x="350" y="325" font-size="9.5" text-anchor="middle" fill="#777">(future) production repo</text>
  </g>

  <g class="dp-node" data-href="onboarding-a-new-entity.md">
    <title>Future production repo for a new entity — same template, no reorganization needed. See "Onboarding a new entity".</title>
    <rect x="470" y="280" width="180" height="65" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="560" y="308" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#555">data-platform-&lt;code&gt;</text>
    <text x="560" y="325" font-size="9.5" text-anchor="middle" fill="#777">(future) entity B, etc.</text>
  </g>

  <line x1="140" y1="280" x2="260" y2="200" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-repo-link)"/>
  <line x1="350" y1="280" x2="350" y2="200" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-repo-link)"/>
  <line x1="560" y1="280" x2="440" y2="200" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-repo-link)"/>
  <text x="350" y="255" font-size="10.5" text-anchor="middle" fill="#888" font-style="italic">links to, never copies</text>

  <g class="dp-node" data-href="repositories-and-delivery.md#why-one-repo-per-entity-not-one-mega-mono-repo-for-the-whole-group">
    <title>Ingestion + dbt + orchestration + Terraform live together per entity. Split by component only pays off with independent per-component release cadences. See "Why one repo per entity".</title>
    <rect x="50" y="400" width="600" height="110" rx="6" fill="white" stroke="#1976d2" stroke-dasharray="4,3"/>
    <text x="350" y="424" font-size="12" font-weight="bold" text-anchor="middle" fill="#0d47a1">Inside each entity repo: one mono-repo</text>
    <text x="350" y="448" font-size="10.5" text-anchor="middle" fill="#555">ingestion/ · transformation/ (dbt) · orchestration/ (Dagster) · infra/ (Terraform)</text>
    <text x="350" y="468" font-size="10.5" text-anchor="middle" fill="#555">A schema change in ingestion and its dbt impact are one commit, not synchronized PRs</text>
    <text x="350" y="492" font-size="9.5" font-style="italic" text-anchor="middle" fill="#888">Split by entity (own subscription, own access), not split by component</text>
  </g>

  <!-- RIGHT PANEL: CI/CD pipeline -->
  <rect x="720" y="80" width="660" height="460" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="1050" y="106" font-size="14" font-weight="bold" text-anchor="middle" fill="#555">Minimal CI/CD (ci.yml)</text>

  <g class="dp-node" data-href="repositories-and-delivery.md#branching">
    <title>Every push and pull request triggers the pipeline. Short-lived feature branches, no long-lived develop branch.</title>
    <rect x="800" y="130" width="500" height="55" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
    <text x="1050" y="163" font-size="13" font-weight="bold" text-anchor="middle" fill="#0d47a1">push / pull request</text>
  </g>

  <line x1="1050" y1="185" x2="1050" y2="215" stroke="#666" stroke-width="2" marker-end="url(#arrow-repo)"/>

  <g class="dp-node" data-href="repositories-and-delivery.md#minimal-cicd">
    <title>Lints Python and SQL/dbt style before anything runs against data.</title>
    <rect x="800" y="215" width="500" height="55" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="1050" y="248" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">lint</text>
  </g>

  <line x1="1050" y1="270" x2="1050" y2="300" stroke="#666" stroke-width="2" marker-end="url(#arrow-repo)"/>

  <g class="dp-node" data-href="repositories-and-delivery.md#minimal-cicd">
    <title>"Does it compile?" — catches syntax and reference errors without touching any data.</title>
    <rect x="800" y="300" width="500" height="55" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="1050" y="333" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">dbt parse</text>
  </g>

  <line x1="1050" y1="355" x2="1050" y2="385" stroke="#666" stroke-width="2" marker-end="url(#arrow-repo)"/>

  <g class="dp-node" data-href="onboarding-an-engineer.md#2-local-dev-setup-about-20-minutes">
    <title>"Does it work on data?" — runs models and tests against dev data (local DuckDB, no cloud resources).</title>
    <rect x="800" y="385" width="500" height="55" rx="6" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.5"/>
    <text x="1050" y="418" font-size="13" font-weight="bold" text-anchor="middle" fill="#312e81">dbt build --target dev</text>
  </g>

  <line x1="1050" y1="440" x2="1050" y2="470" stroke="#666" stroke-width="2" marker-end="url(#arrow-repo)"/>

  <g class="dp-node" data-href="repositories-and-delivery.md#minimal-cicd">
    <title>Optional for a single-owner platform, and must be explicitly documented as "not implemented" if it isn't built — never a half-working pipeline that looks automated but silently isn't.</title>
    <rect x="800" y="470" width="500" height="55" rx="6" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="1050" y="500" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#78350f">deploy to VM (optional, documented either way)</text>
  </g>
</svg>
