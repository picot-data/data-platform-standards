<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="Segoe UI, Arial, sans-serif" class="dp-diagram" role="img" aria-label="Top: how the four repos relate to an entity repo. Bottom: for a given change, which repo to edit and what happens next.">

  <rect width="1000" height="800" fill="#ffffff"/>

  <defs>
    <marker id="cp-arrow-live" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L9,5.5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="cp-arrow-copy" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L9,5.5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <text x="500" y="30" font-size="19" font-weight="bold" text-anchor="middle" fill="#003f5c">Repo Relationships and Change Playbook</text>
  <text x="500" y="52" font-size="11.5" text-anchor="middle" fill="#666">Top: what an entity repo pulls in, and how. Bottom: for a given change, which repo to edit and what happens next.</text>

  <!-- ============ TOP PANEL: relationships ============ -->
  <rect x="20" y="70" width="960" height="290" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="500" y="94" font-size="13" font-weight="bold" text-anchor="middle" fill="#555">What an entity repo pulls in</text>

  <g class="dp-node" data-href="index.md">
    <title>Group-wide rules and ADRs — linked, never copied.</title>
    <rect x="45" y="115" width="205" height="60" rx="6" fill="#ee4631"/>
    <text x="147" y="140" font-size="11.5" font-weight="bold" text-anchor="middle" fill="white">data-platform-</text>
    <text x="147" y="156" font-size="11.5" font-weight="bold" text-anchor="middle" fill="white">standards</text>
  </g>

  <g class="dp-node" data-href="https://github.com/picot-data/terraform-azure-data-platform">
    <title>modules/entity + modules/governance — consumed pinned to a tagged ref.</title>
    <rect x="270" y="115" width="205" height="60" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="372" y="140" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#4c1d95">terraform-azure-</text>
    <text x="372" y="156" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#4c1d95">data-platform</text>
  </g>

  <g class="dp-node" data-href="https://github.com/picot-data/data-platform-workflows">
    <title>entity-ci.yml — called via uses:, tracked at @main.</title>
    <rect x="495" y="115" width="205" height="60" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="597" y="140" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#4c1d95">data-platform-</text>
    <text x="597" y="156" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#4c1d95">workflows</text>
  </g>

  <g class="dp-node" data-href="https://github.com/picot-data/data-platform-entity-template">
    <title>The mono-repo skeleton — "Use this template", once, not kept in sync afterward.</title>
    <rect x="720" y="115" width="205" height="60" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="822" y="140" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#4c1d95">data-platform-</text>
    <text x="822" y="156" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#4c1d95">entity-template</text>
  </g>

  <!-- connectors down to the entity repo box -->
  <path d="M147,175 V255 H380 V270" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#cp-arrow-copy)"/>
  <path d="M372,175 V230 H460 V270" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#cp-arrow-live)"/>
  <path d="M597,175 V230 H540 V270" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#cp-arrow-live)"/>
  <path d="M822,175 V255 H620 V270" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#cp-arrow-copy)"/>

  <text x="147" y="196" font-size="9.5" font-style="italic" text-anchor="middle" fill="#888">links to</text>
  <text x="372" y="196" font-size="9.5" font-style="italic" fill="#6d28d9">pinned by ref</text>
  <text x="700" y="196" font-size="9.5" font-style="italic" text-anchor="end" fill="#6d28d9">called via uses: @main</text>
  <text x="822" y="196" font-size="9.5" font-style="italic" text-anchor="middle" fill="#888">copied once</text>

  <g class="dp-node" data-href="onboarding-a-new-entity.md">
    <title>Any entity repo — dti, bg, or a future one. Created from the template, wired to the other three.</title>
    <rect x="330" y="270" width="340" height="65" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
    <text x="500" y="298" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0d47a1">data-platform-&lt;entity&gt;</text>
    <text x="500" y="317" font-size="10" text-anchor="middle" fill="#1565c0">dti, bg, or the next one onboarded</text>
  </g>

  <text x="45" y="352" font-size="9.5" font-style="italic" fill="#888">Solid purple = live reference (bump a ref/tag, or track @main). Grey dashed = copied once, not resynced.</text>

  <!-- ============ BOTTOM PANEL: change playbook ============ -->
  <rect x="20" y="378" width="960" height="410" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="500" y="402" font-size="13" font-weight="bold" text-anchor="middle" fill="#555">Making a change — which repo, then what</text>

  <!-- column headers -->
  <text x="45" y="424" font-size="10" font-weight="bold" fill="#888">IF YOU WANT TO...</text>
  <text x="405" y="424" font-size="10" font-weight="bold" fill="#888">EDIT</text>
  <text x="560" y="424" font-size="10" font-weight="bold" fill="#888">THEN</text>

  <!-- Row 1 -->
  <line x1="45" y1="436" x2="955" y2="436" stroke="#e5e7eb"/>
  <text x="45" y="458" font-size="11" fill="#333">Fix a bug in the VM / network / Key Vault setup,</text>
  <text x="45" y="474" font-size="11" fill="#333">for every entity</text>
  <g class="dp-node" data-href="https://github.com/picot-data/terraform-azure-data-platform">
    <title>modules/entity — the resource group, VM, NSG, Key Vault code.</title>
    <rect x="400" y="446" width="150" height="34" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="475" y="467" font-size="10.5" text-anchor="middle" fill="#4c1d95">modules/entity</text>
  </g>
  <text x="560" y="459" font-size="10.5" fill="#333">Tag a new version, then per entity: bump</text>
  <text x="560" y="474" font-size="10.5" fill="#333">the root module's `ref` and `terraform plan`</text>

  <!-- Row 2 -->
  <line x1="45" y1="490" x2="955" y2="490" stroke="#e5e7eb"/>
  <text x="45" y="512" font-size="11" fill="#333">Change one entity's monthly budget amount</text>
  <g class="dp-node" data-href="onboarding-a-new-entity.md#2-infrastructure-new-tfvars-same-terraform-module">
    <title>Only that entity's own .tfvars — nothing shared changes.</title>
    <rect x="400" y="498" width="150" height="34" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.2"/>
    <text x="475" y="519" font-size="10.5" text-anchor="middle" fill="#0d47a1">that entity's .tfvars</text>
  </g>
  <text x="560" y="519" font-size="10.5" fill="#333">`terraform apply` for that entity only</text>

  <!-- Row 3 -->
  <line x1="45" y1="544" x2="955" y2="544" stroke="#e5e7eb"/>
  <text x="45" y="566" font-size="11" fill="#333">Add or change a CI step (a lint rule, a new check)</text>
  <g class="dp-node" data-href="https://github.com/picot-data/data-platform-workflows">
    <title>entity-ci.yml — the reusable workflow.</title>
    <rect x="400" y="552" width="150" height="34" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="475" y="573" font-size="10.5" text-anchor="middle" fill="#4c1d95">entity-ci.yml</text>
  </g>
  <text x="560" y="565" font-size="10.5" fill="#333">Nothing else — every entity tracks @main,</text>
  <text x="560" y="580" font-size="10.5" fill="#333">the next push already runs the new version</text>

  <!-- Row 4 -->
  <line x1="45" y1="598" x2="955" y2="598" stroke="#e5e7eb"/>
  <text x="45" y="620" font-size="11" fill="#333">Add a new top-level folder to the entity skeleton</text>
  <text x="45" y="636" font-size="11" fill="#333">(e.g. quality/)</text>
  <g class="dp-node" data-href="https://github.com/picot-data/data-platform-entity-template">
    <title>The template repo — copied once, never resynced.</title>
    <rect x="400" y="606" width="150" height="34" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="6,4"/>
    <text x="475" y="627" font-size="10.5" text-anchor="middle" fill="#4c1d95">the template repo</text>
  </g>
  <text x="560" y="619" font-size="10.5" fill="#92400e">Does not reach entities already created —</text>
  <text x="560" y="634" font-size="10.5" fill="#92400e">back-port by hand into each one (ADR 0011)</text>

  <!-- Row 5 -->
  <line x1="45" y1="652" x2="955" y2="652" stroke="#e5e7eb"/>
  <text x="45" y="674" font-size="11" fill="#333">Change a naming or tagging rule</text>
  <g class="dp-node" data-href="index.md">
    <title>Docs only — entities link to this site, they don't copy it.</title>
    <rect x="400" y="660" width="150" height="34" rx="5" fill="#fee2e2" stroke="#ee4631" stroke-width="1.2"/>
    <text x="475" y="681" font-size="10.5" text-anchor="middle" fill="#991b1b">data-platform-standards</text>
  </g>
  <text x="560" y="673" font-size="10.5" fill="#333">Nothing to change in entity repos, unless it's</text>
  <text x="560" y="688" font-size="10.5" fill="#333">a new mandatory tag — see below</text>

  <!-- Row 6 -->
  <line x1="45" y1="706" x2="955" y2="706" stroke="#e5e7eb"/>
  <text x="45" y="728" font-size="11" fill="#333">Add a new mandatory tag</text>
  <g class="dp-node" data-href="onboarding-a-new-entity.md#2-infrastructure-new-tfvars-same-terraform-module">
    <title>local.common_tags lives in each entity's own root module, not in a shared module — see ADR 0011.</title>
    <rect x="400" y="714" width="150" height="34" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.2"/>
    <text x="475" y="735" font-size="10.5" text-anchor="middle" fill="#0d47a1">each entity's root module</text>
  </g>
  <text x="560" y="727" font-size="10.5" fill="#92400e">By hand, in every entity's local.common_tags —</text>
  <text x="560" y="742" font-size="10.5" fill="#92400e">tags are deliberately not a shared module output</text>

  <text x="45" y="768" font-size="9.5" font-style="italic" fill="#888">Amber rows = the one thing this setup does not deduplicate automatically — worth knowing before it surprises you.</text>
</svg>
