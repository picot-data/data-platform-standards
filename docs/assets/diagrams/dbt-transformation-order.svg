<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" font-family="Segoe UI, Arial, sans-serif" class="dp-diagram" role="img" aria-label="dbt layers in transformation order: Silver staging models feed an intermediate join and the Gold dimensions, both feed the Gold fact table, which feeds an analytical mart.">

  <rect width="1080" height="480" fill="#ffffff"/>

  <defs>
    <marker id="dto-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L9,5.5 L0,10 z" fill="#5b6570"/>
    </marker>
  </defs>

  <text x="540" y="32" font-size="19" font-weight="bold" text-anchor="middle" fill="#003f5c">The dbt Layers, in Transformation Order</text>
  <text x="540" y="54" font-size="11.5" text-anchor="middle" fill="#666">Staging feeds an intermediate join and the Gold dimensions; both feed the fact table; the fact feeds a mart. Hover a box for detail, click to jump to Naming conventions.</text>

  <!-- Group backgrounds -->
  <rect x="20" y="76" width="190" height="242" rx="8" fill="#f4f5f6" stroke="#8a94a3" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="115" y="96" font-size="11" font-weight="bold" text-anchor="middle" fill="#555">SILVER — cleansed data</text>

  <rect x="230" y="76" width="190" height="242" rx="8" fill="#f8fafc" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="325" y="96" font-size="11" font-weight="bold" text-anchor="middle" fill="#555">INTERMEDIATE — joins, enrichments</text>

  <rect x="440" y="76" width="190" height="242" rx="8" fill="#fefbf0" stroke="#d4af00" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="535" y="96" font-size="11" font-weight="bold" text-anchor="middle" fill="#8a6e00">GOLD — DIMENSIONS</text>

  <rect x="650" y="76" width="190" height="242" rx="8" fill="#fefbf0" stroke="#d4af00" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="745" y="96" font-size="11" font-weight="bold" text-anchor="middle" fill="#8a6e00">GOLD — FACTS</text>

  <rect x="860" y="76" width="200" height="242" rx="8" fill="#fefbf0" stroke="#d4af00" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="960" y="96" font-size="11" font-weight="bold" text-anchor="middle" fill="#8a6e00">GOLD — ANALYTICAL MARTS</text>

  <!-- Edges -->
  <path d="M195,133 H220 V178 H245" fill="none" stroke="#5b6570" stroke-width="1.5" marker-end="url(#dto-arrow)"/>
  <path d="M195,203 H245" fill="none" stroke="#5b6570" stroke-width="1.5" marker-end="url(#dto-arrow)"/>
  <path d="M195,273 H220 V228 H245" fill="none" stroke="#5b6570" stroke-width="1.5" marker-end="url(#dto-arrow)"/>
  <path d="M405,203 H635 V193 H665" fill="none" stroke="#5b6570" stroke-width="1.5" marker-end="url(#dto-arrow)"/>
  <path d="M615,133 H640 V173 H665" fill="none" stroke="#5b6570" stroke-width="1.5" marker-end="url(#dto-arrow)"/>
  <path d="M615,203 H640 V213 H665" fill="none" stroke="#5b6570" stroke-width="1.5" marker-end="url(#dto-arrow)"/>
  <path d="M615,273 H640 V233 H665" fill="none" stroke="#5b6570" stroke-width="1.5" marker-end="url(#dto-arrow)"/>
  <path d="M825,203 H875" fill="none" stroke="#5b6570" stroke-width="1.5" marker-end="url(#dto-arrow)"/>
  <path d="M35,203 H28 V330 H535 V228" fill="none" stroke="#5b6570" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#dto-arrow)"/>
  <path d="M115,298 V345 H535 V298" fill="none" stroke="#5b6570" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#dto-arrow)"/>

  <!-- SILVER nodes -->
  <g class="dp-node" data-href="naming-conventions.md#dbt-model-naming">
    <title>Staging (stg_): one-to-one with a source object — renaming, retyping, light cleansing. No joins, no aggregation. See "dbt model naming".</title>
    <rect x="35" y="108" width="160" height="50" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
    <text x="115" y="129" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0d47a1">stg_sap__order</text>
    <text x="115" y="145" font-size="9.5" text-anchor="middle" fill="#1565c0">staging</text>
  </g>

  <g class="dp-node" data-href="naming-conventions.md#dbt-model-naming">
    <title>Staging (stg_): one-to-one with a source object — renaming, retyping, light cleansing. Feeds both the intermediate join and its own Gold dimension. See "dbt model naming".</title>
    <rect x="35" y="178" width="160" height="50" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
    <text x="115" y="199" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0d47a1">stg_sap__customer</text>
    <text x="115" y="215" font-size="9.5" text-anchor="middle" fill="#1565c0">staging</text>
  </g>

  <g class="dp-node" data-href="naming-conventions.md#dbt-model-naming">
    <title>Staging (stg_): one-to-one with a source object — renaming, retyping, light cleansing. Feeds both the intermediate join and its own Gold dimension. See "dbt model naming".</title>
    <rect x="35" y="248" width="160" height="50" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
    <text x="115" y="269" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0d47a1">stg_sap__product</text>
    <text x="115" y="285" font-size="9.5" text-anchor="middle" fill="#1565c0">staging</text>
  </g>

  <!-- INTERMEDIATE node -->
  <g class="dp-node" data-href="naming-conventions.md#dbt-model-naming">
    <title>Intermediate (int_): joins and enrichments that don't yet belong to a specific dimension or fact. Materialized as a table, disposable by design — no ADLS folder of its own (see ADR 0001). See "dbt model naming".</title>
    <rect x="245" y="163" width="160" height="80" rx="5" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
    <text x="325" y="197" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0d47a1">int_order_enriched</text>
    <text x="325" y="215" font-size="9" text-anchor="middle" fill="#1565c0">order + customer + product</text>
  </g>

  <!-- GOLD DIMENSIONS nodes -->
  <g class="dp-node" data-href="naming-conventions.md#dbt-model-naming">
    <title>Dimensions (dim_): descriptive attributes of a business entity. dim_date has no upstream edge here — it's typically built from a date spine, not from a SAP staging model. See "dbt model naming".</title>
    <rect x="455" y="108" width="160" height="50" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="535" y="129" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#14532d">dim_date</text>
    <text x="535" y="145" font-size="9.5" text-anchor="middle" fill="#166534">dimension</text>
  </g>

  <g class="dp-node" data-href="naming-conventions.md#dbt-model-naming">
    <title>Dimensions (dim_): descriptive attributes of a business entity (customer, product, date). Never holds measures. See "dbt model naming".</title>
    <rect x="455" y="178" width="160" height="50" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="535" y="199" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#14532d">dim_customer</text>
    <text x="535" y="215" font-size="9.5" text-anchor="middle" fill="#166534">dimension</text>
  </g>

  <g class="dp-node" data-href="naming-conventions.md#dbt-model-naming">
    <title>Dimensions (dim_): descriptive attributes of a business entity (customer, product, date). Never holds measures. See "dbt model naming".</title>
    <rect x="455" y="248" width="160" height="50" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="535" y="269" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#14532d">dim_product</text>
    <text x="535" y="285" font-size="9.5" text-anchor="middle" fill="#166534">dimension</text>
  </g>

  <!-- GOLD FACTS node -->
  <g class="dp-node" data-href="naming-conventions.md#dbt-model-naming">
    <title>Facts (fct_): measurable events of a business process (an order, a delivery). References dimensions by key, never duplicates their attributes. See "dbt model naming".</title>
    <rect x="665" y="163" width="160" height="80" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="745" y="197" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#14532d">fct_order</text>
    <text x="745" y="215" font-size="9.5" text-anchor="middle" fill="#166534">fact</text>
  </g>

  <!-- MARTS node -->
  <g class="dp-node" data-href="building-a-data-model/data-layers.md#why-a-star-schema-not-marts-built-directly-from-staging">
    <title>Marts (mart_): pre-aggregated, domain-specific views for a recurring or complex analysis. A commodity built on top of dimensions and facts, never the source of truth. See "Why a star schema".</title>
    <rect x="875" y="163" width="170" height="80" rx="5" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
    <text x="960" y="195" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#14532d">mart_finance__</text>
    <text x="960" y="209" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#14532d">monthly_revenue</text>
    <text x="960" y="226" font-size="9" text-anchor="middle" fill="#166534">analytical mart</text>
  </g>

  <!-- Reading notes -->
  <rect x="20" y="372" width="1040" height="90" rx="6" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="38" y="392" font-size="12" font-weight="bold" fill="#333">Reading this diagram</text>
  <text x="38" y="414" font-size="11" fill="#333">Each group is a dbt model layer, in the order a `dbt build` resolves them: staging first, then the intermediate join, then Gold dimensions and facts, then marts.</text>
  <text x="38" y="434" font-size="11" fill="#333">dim_date has no upstream edge here — it's typically built from a date spine, not from a SAP staging model.</text>
  <text x="38" y="454" font-size="11" fill="#333">stg_sap__customer and stg_sap__product each feed two things: the intermediate join, and their own Gold dimension (dashed lines).</text>
</svg>
