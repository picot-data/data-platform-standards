<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="Segoe UI, Arial, sans-serif" class="dp-diagram" role="img" aria-label="Two axes describe a dbt model: the medallion layer it is stored in, on top, and the kind of SQL transformation that produced it, below.">

  <rect width="960" height="480" fill="#ffffff"/>

  <text x="480" y="32" font-size="19" font-weight="bold" text-anchor="middle" fill="#003f5c">Two Axes, Not One: Medallion vs. dbt Model Layers</text>
  <text x="480" y="54" font-size="11.5" text-anchor="middle" fill="#666">Top row = how refined and how durable. Bottom row = what kind of SQL transformation. A model has exactly one position on each.</text>

  <text x="56" y="145" font-size="10.5" font-weight="bold" fill="#888" letter-spacing="1" transform="rotate(-90 56 145)" text-anchor="middle">MEDALLION</text>
  <text x="56" y="265" font-size="10.5" font-weight="bold" fill="#888" letter-spacing="1" transform="rotate(-90 56 265)" text-anchor="middle">DBT LAYER</text>

  <!-- Medallion row -->
  <g class="dp-node" data-href="platform-overview.md#extraction-sap-to-cloud">
    <title>Bronze: raw and immutable. Not a dbt model at all — written by the ingestion pipeline, read-only for dbt.</title>
    <rect x="102" y="110" width="128" height="70" rx="6" fill="#f2ddc4" stroke="#a5691f" stroke-width="1.5"/>
    <text x="166" y="142" font-size="14" font-weight="bold" text-anchor="middle" fill="#5c3813">Bronze</text>
    <text x="166" y="162" font-size="10.5" text-anchor="middle" fill="#8a5722">raw, immutable</text>
  </g>

  <g class="dp-node" data-href="building-a-data-model/data-layers.md#persistence-per-layer">
    <title>Silver: cleansed data. Corresponds to stg_ models, persisted to ADLS as Parquet — see ADR 0001.</title>
    <rect x="242" y="110" width="128" height="70" rx="6" fill="#e6e9ed" stroke="#8a94a3" stroke-width="1.5"/>
    <text x="306" y="142" font-size="14" font-weight="bold" text-anchor="middle" fill="#374151">Silver</text>
    <text x="306" y="162" font-size="10.5" text-anchor="middle" fill="#55606f">cleansed</text>
  </g>

  <g class="dp-node" data-href="https://github.com/picot-data/data-platform-standards/blob/main/adr/0001-medallion-dbt-layer-persistence.md">
    <title>Intermediate models sit in late Silver conceptually, but have no ADLS folder of their own — they live only in the local DuckDB file on the VM. See ADR 0001.</title>
    <rect x="382" y="110" width="128" height="70" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="446" y="142" font-size="12" font-weight="bold" text-anchor="middle" fill="#555">no ADLS folder</text>
    <text x="446" y="162" font-size="10.5" text-anchor="middle" fill="#777">DuckDB file only</text>
  </g>

  <g class="dp-node" data-href="building-a-data-model/data-layers.md#persistence-per-layer">
    <title>Gold: the modeled, consumed product. Corresponds to dim_, fct_ and mart_ models, all persisted to ADLS.</title>
    <rect x="522" y="110" width="408" height="70" rx="6" fill="#fdf6d8" stroke="#d4af00" stroke-width="1.5"/>
    <text x="726" y="142" font-size="14" font-weight="bold" text-anchor="middle" fill="#6b5300">Gold</text>
    <text x="726" y="162" font-size="10.5" text-anchor="middle" fill="#8a6e00">modeled, consumed — one medallion layer, three dbt layers</text>
  </g>

  <!-- Column connectors -->
  <line x1="166" y1="180" x2="166" y2="230" stroke="#c4c9d0" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="306" y1="180" x2="306" y2="230" stroke="#c4c9d0" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="446" y1="180" x2="446" y2="230" stroke="#c4c9d0" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="586" y1="180" x2="586" y2="230" stroke="#c4c9d0" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="726" y1="180" x2="726" y2="230" stroke="#c4c9d0" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="866" y1="180" x2="866" y2="230" stroke="#c4c9d0" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- dbt layer row -->
  <g class="dp-node" data-href="platform-overview.md">
    <title>Bronze is the ingestion pipeline's raw output. dbt reads it, never writes it.</title>
    <rect x="102" y="230" width="128" height="70" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="166" y="262" font-size="11.5" text-anchor="middle" fill="#9ca3af">not a dbt model</text>
    <text x="166" y="281" font-size="10.5" text-anchor="middle" fill="#c0c5cc">ingestion output</text>
  </g>

  <g class="dp-node" data-href="naming-conventions.md#dbt-model-naming">
    <title>stg_ — one-to-one with a source object: renaming, retyping, light cleansing. No joins, no aggregation.</title>
    <rect x="242" y="230" width="128" height="70" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
    <text x="306" y="262" font-size="13" font-weight="bold" text-anchor="middle" fill="#0d47a1">staging</text>
    <text x="306" y="282" font-size="11" text-anchor="middle" fill="#1565c0">stg_</text>
  </g>

  <g class="dp-node" data-href="naming-conventions.md#dbt-model-naming">
    <title>int_ — joins and enrichments not yet ready for Gold. Materialized as a table for debuggability, disposable by design.</title>
    <rect x="382" y="230" width="128" height="70" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
    <text x="446" y="262" font-size="13" font-weight="bold" text-anchor="middle" fill="#0d47a1">intermediate</text>
    <text x="446" y="282" font-size="11" text-anchor="middle" fill="#1565c0">int_</text>
  </g>

  <g class="dp-node" data-href="building-a-data-model/data-layers.md#the-dbt-layers-in-transformation-order">
    <title>dim_ — descriptive attributes of a business entity (customer, product, date). Never holds measures.</title>
    <rect x="522" y="230" width="128" height="70" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="586" y="262" font-size="13" font-weight="bold" text-anchor="middle" fill="#14532d">dimensions</text>
    <text x="586" y="282" font-size="11" text-anchor="middle" fill="#166534">dim_</text>
  </g>

  <g class="dp-node" data-href="building-a-data-model/data-layers.md#the-dbt-layers-in-transformation-order">
    <title>fct_ — measurable events of a business process (an order, a delivery). References dimensions by key.</title>
    <rect x="662" y="230" width="128" height="70" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="726" y="262" font-size="13" font-weight="bold" text-anchor="middle" fill="#14532d">facts</text>
    <text x="726" y="282" font-size="11" text-anchor="middle" fill="#166534">fct_</text>
  </g>

  <g class="dp-node" data-href="building-a-data-model/data-layers.md#why-a-star-schema-not-marts-built-directly-from-staging">
    <title>mart_ — pre-aggregated, domain-specific views built on top of dimensions and facts. A commodity, never the source of truth.</title>
    <rect x="802" y="230" width="128" height="70" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
    <text x="866" y="262" font-size="13" font-weight="bold" text-anchor="middle" fill="#14532d">marts</text>
    <text x="866" y="282" font-size="11" text-anchor="middle" fill="#166534">mart_</text>
  </g>

  <!-- Reading notes -->
  <rect x="30" y="340" width="900" height="118" rx="6" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="48" y="364" font-size="12" font-weight="bold" fill="#333">Reading this diagram</text>
  <text x="48" y="388" font-size="11.5" fill="#333">Each column is one dbt model layer. The box above it is the medallion layer where that model physically lives.</text>
  <text x="48" y="410" font-size="11.5" fill="#333">Intermediate is the one dbt layer with no ADLS folder: int_ models exist only inside the DuckDB file on the VM, disposable by design.</text>
  <text x="48" y="432" font-size="11.5" fill="#333">Dimensions, facts and marts all live in Gold — but only dim_ and fct_ are the source of truth; mart_ is built on top of them, never the reverse.</text>
</svg>
