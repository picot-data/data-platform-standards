<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 460" font-family="Segoe UI, Arial, sans-serif" class="dp-diagram">

  <rect width="1400" height="460" fill="#ffffff"/>

  <text x="700" y="32" font-size="22" font-weight="bold" text-anchor="middle" fill="#003f5c">Two Axes, Not One: Medallion vs. dbt Model Layers</text>
  <text x="700" y="53" font-size="12.5" text-anchor="middle" fill="#666">Top row = refinement &amp; durability. Bottom row = kind of SQL transformation. A model has exactly one position on each.</text>

  <text x="20" y="105" font-size="11" font-weight="bold" fill="#888" transform="rotate(-90 20 105)" text-anchor="middle">MEDALLION</text>

  <!-- Medallion row -->
  <g class="dp-node" data-href="platform-overview.md#extraction-sap-to-cloud">
    <title>Raw, immutable — not a dbt model at all, written by the ingestion pipeline.</title>
    <rect x="40" y="90" width="240" height="70" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <text x="160" y="122" font-size="14" font-weight="bold" text-anchor="middle" fill="#78350f">Bronze</text>
    <text x="160" y="140" font-size="10.5" text-anchor="middle" fill="#92400e">raw, immutable</text>
  </g>

  <g class="dp-node" data-href="naming-conventions.md#persistence-per-layer">
    <title>Corresponds to stg_ models. Persisted to ADLS Parquet — see ADR 0001.</title>
    <rect x="300" y="90" width="200" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="400" y="122" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Silver</text>
    <text x="400" y="140" font-size="10.5" text-anchor="middle" fill="#1d4ed8">cleansed</text>
  </g>

  <g class="dp-node" data-href="https://github.com/picot-data/data-platform-standards/blob/main/adr/0001-medallion-dbt-layer-persistence.md">
    <title>Intermediate models sit here conceptually but have no ADLS folder of their own — they live only in the local DuckDB file. See ADR 0001.</title>
    <rect x="520" y="90" width="200" height="70" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="620" y="118" font-size="12" font-weight="bold" text-anchor="middle" fill="#555">(no ADLS folder)</text>
    <text x="620" y="136" font-size="10" text-anchor="middle" fill="#777">DuckDB file only, on the VM</text>
  </g>

  <g class="dp-node" data-href="naming-conventions.md#persistence-per-layer">
    <title>Corresponds to dim_, fct_, and mart_ models. The consumed product, persisted to ADLS.</title>
    <rect x="740" y="90" width="620" height="70" rx="6" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.5"/>
    <text x="1050" y="122" font-size="14" font-weight="bold" text-anchor="middle" fill="#312e81">Gold</text>
    <text x="1050" y="140" font-size="10.5" text-anchor="middle" fill="#3730a3">modeled, consumed</text>
  </g>

  <!-- Connectors -->
  <line x1="160" y1="160" x2="160" y2="200" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="400" y1="160" x2="400" y2="200" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="620" y1="160" x2="620" y2="200" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="837" y1="160" x2="837" y2="200" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="1042" y1="160" x2="1042" y2="200" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="1247" y1="160" x2="1247" y2="200" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3,3"/>

  <text x="20" y="245" font-size="11" font-weight="bold" fill="#888" transform="rotate(-90 20 245)" text-anchor="middle">DBT LAYER</text>

  <!-- dbt layer row -->
  <g class="dp-node" data-href="platform-overview.md">
    <title>Not a dbt model — the ingestion pipeline's raw output, read-only for dbt.</title>
    <rect x="40" y="210" width="240" height="70" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="160" y="250" font-size="12" text-anchor="middle" fill="#9ca3af">(not a dbt model)</text>
  </g>

  <g class="dp-node" data-href="naming-conventions.md#dbt-model-naming">
    <title>stg_ — one-to-one with a source object. No joins, no aggregation.</title>
    <rect x="300" y="210" width="200" height="70" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
    <text x="400" y="242" font-size="13" font-weight="bold" text-anchor="middle" fill="#0d47a1">staging</text>
    <text x="400" y="260" font-size="10.5" text-anchor="middle" fill="#1565c0">stg_</text>
  </g>

  <g class="dp-node" data-href="naming-conventions.md#dbt-model-naming">
    <title>int_ — joins and enrichments not yet ready for Gold. Materialized as a table for debuggability, disposable by design.</title>
    <rect x="520" y="210" width="200" height="70" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
    <text x="620" y="242" font-size="13" font-weight="bold" text-anchor="middle" fill="#0d47a1">intermediate</text>
    <text x="620" y="260" font-size="10.5" text-anchor="middle" fill="#1565c0">int_</text>
  </g>

  <g class="dp-node" data-href="data-layers.md#the-dbt-layers-in-transformation-order">
    <title>dim_ — descriptive attributes of a business entity (customer, product, date).</title>
    <rect x="740" y="210" width="195" height="70" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="837" y="242" font-size="13" font-weight="bold" text-anchor="middle" fill="#14532d">dimensions</text>
    <text x="837" y="260" font-size="10.5" text-anchor="middle" fill="#166534">dim_</text>
  </g>

  <g class="dp-node" data-href="data-layers.md#the-dbt-layers-in-transformation-order">
    <title>fct_ — measurable events of a business process (an order, a delivery).</title>
    <rect x="945" y="210" width="195" height="70" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="1042" y="242" font-size="13" font-weight="bold" text-anchor="middle" fill="#14532d">facts</text>
    <text x="1042" y="260" font-size="10.5" text-anchor="middle" fill="#166534">fct_</text>
  </g>

  <g class="dp-node" data-href="data-layers.md#why-a-star-schema-not-marts-built-directly-from-staging">
    <title>mart_ — pre-aggregated, domain-specific views built on top of dimensions and facts. A commodity, never the source of truth.</title>
    <rect x="1150" y="210" width="210" height="70" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
    <text x="1255" y="242" font-size="13" font-weight="bold" text-anchor="middle" fill="#14532d">marts</text>
    <text x="1255" y="260" font-size="10.5" text-anchor="middle" fill="#166534">mart_</text>
  </g>

  <!-- Legend -->
  <rect x="40" y="330" width="1320" height="110" rx="6" fill="#fafafa" stroke="#ddd"/>
  <text x="60" y="352" font-size="12.5" font-weight="bold" fill="#333">Reading this diagram</text>
  <text x="60" y="374" font-size="12" fill="#333">Each column is one dbt model layer. Its top box shows the medallion layer it maps to (or its persistence exception, for intermediate).</text>
  <text x="60" y="394" font-size="12" fill="#333">Intermediate models are the one dbt layer with no ADLS folder — they exist only inside the DuckDB file on the VM, disposable by design.</text>
  <text x="60" y="414" font-size="12" fill="#333">Dimensions, facts, and marts all live in Gold, but only dimensions and facts are the source of truth — marts are built on top of them, never the reverse.</text>
</svg>
