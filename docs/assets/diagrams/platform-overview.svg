<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 816" font-family="Segoe UI, Arial, sans-serif" class="dp-diagram" role="img" aria-label="Level 1 end-to-end flow: SAP is extracted by Azure Data Factory (or, as a fallback, an existing ABAP script) into Bronze, refined by dbt into Silver and then into the Gold star schema, where each metric is defined once in a dbt mart, exposed through Metabase and catalogued by dbt's own documentation site.">

  <rect width="940" height="816" fill="#ffffff"/>

  <defs>
    <marker id="po-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L9,5.5 L0,10 z" fill="#5b6570"/>
    </marker>
    <marker id="po-arrow-meta" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L9,5.5 L0,10 z" fill="#0d9488"/>
    </marker>
  </defs>

  <text x="470" y="34" font-size="19" font-weight="bold" text-anchor="middle" fill="#003f5c">Platform Overview — Level 1 End-to-End Flow</text>
  <text x="470" y="56" font-size="11.5" text-anchor="middle" fill="#666">Middle column: the tools. Right column: what lands in ADLS. Hover a box for detail, click to jump to the section that explains it.</text>

  <!-- Orchestration boundary: everything Dagster schedules, on the VM.
       Deliberately starts below the extraction row: Azure Data Factory is a
       managed service that schedules itself and is not on the VM. -->
  <rect x="235" y="286" width="230" height="256" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="7,5"/>
  <g class="dp-node" data-href="platform-overview.md#orchestration-dagster-oss">
    <title>Dagster OSS schedules and monitors everything inside this boundary, on the VM. The only VM tool that runs as a continuous service. SAP extraction is scheduled by Azure Data Factory itself, outside this boundary. See "Orchestration — Dagster OSS".</title>
    <rect x="247" y="512" width="206" height="22" rx="4" fill="#7c3aed"/>
    <text x="350" y="527" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Dagster OSS — orchestration</text>
  </g>

  <!-- Row 1: extraction -->
  <g class="dp-node" data-href="platform-overview.md#extraction-sap-to-cloud">
    <title>SAP ERP, on-premise. Extracted via Azure Data Factory (primary) or, as a fallback, the existing ABAP extraction script. See "Extraction — SAP to cloud".</title>
    <rect x="40" y="196" width="180" height="70" rx="6" fill="#dbeeff" stroke="#0069af" stroke-width="1.5"/>
    <text x="130" y="226" font-size="14" font-weight="bold" text-anchor="middle" fill="#00395c">SAP ERP</text>
    <text x="130" y="246" font-size="11" text-anchor="middle" fill="#0069af">on-premise source</text>
  </g>

  <line x1="220" y1="231" x2="250" y2="231" stroke="#5b6570" stroke-width="2" marker-end="url(#po-arrow)"/>

  <g class="dp-node" data-href="https://github.com/picot-data/data-platform-standards/blob/main/adr/0010-adf-not-python-scripts-for-sap.md">
    <title>Azure Data Factory + self-hosted integration runtime — a managed Azure service, not on the Level 1 VM, with its own scheduling and monitoring. Fallback: reuse the existing ABAP extraction script already in production elsewhere in the group. See ADR 0010.</title>
    <rect x="250" y="196" width="200" height="70" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
    <text x="350" y="222" font-size="14" font-weight="bold" text-anchor="middle" fill="#0d47a1">Azure Data Factory</text>
    <text x="350" y="240" font-size="10.5" text-anchor="middle" fill="#1565c0">SAP ingestion — managed</text>
    <text x="350" y="257" font-size="8.5" font-style="italic" text-anchor="middle" fill="#5b6570">alt: existing ABAP script</text>
  </g>

  <line x1="450" y1="231" x2="500" y2="231" stroke="#5b6570" stroke-width="2" marker-end="url(#po-arrow)"/>

  <g class="dp-node" data-href="data-layers.md#persistence-per-layer">
    <title>Bronze: raw, immutable, date-partitioned. Written by the ingestion pipeline and never by dbt. See "Persistence per layer".</title>
    <rect x="500" y="196" width="180" height="70" rx="6" fill="#f2ddc4" stroke="#a5691f" stroke-width="1.5"/>
    <text x="590" y="226" font-size="14" font-weight="bold" text-anchor="middle" fill="#5c3813">Bronze</text>
    <text x="590" y="246" font-size="11" text-anchor="middle" fill="#8a5722">ADLS — raw, immutable</text>
  </g>

  <path d="M590,266 V291 H350 V316" fill="none" stroke="#5b6570" stroke-width="2" marker-end="url(#po-arrow)"/>

  <!-- Row 2: staging -->
  <g class="dp-node" data-href="data-layers.md#the-dbt-layers-in-transformation-order">
    <title>Staging models (stg_): one-to-one with a source object, renaming and light cleansing. No joins, no aggregation. See "The dbt layers, in transformation order".</title>
    <rect x="250" y="316" width="200" height="70" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
    <text x="350" y="346" font-size="14" font-weight="bold" text-anchor="middle" fill="#0d47a1">dbt Core</text>
    <text x="350" y="366" font-size="11" text-anchor="middle" fill="#1565c0">staging — stg_</text>
  </g>

  <line x1="450" y1="351" x2="500" y2="351" stroke="#5b6570" stroke-width="2" marker-end="url(#po-arrow)"/>

  <g class="dp-node" data-href="https://github.com/picot-data/data-platform-standards/blob/main/adr/0001-medallion-dbt-layer-persistence.md">
    <title>Silver: cleansed data, persisted to ADLS as Parquet so downstream rebuilds don't depend on SAP being available. See ADR 0001.</title>
    <rect x="500" y="316" width="180" height="70" rx="6" fill="#e6e9ed" stroke="#8a94a3" stroke-width="1.5"/>
    <text x="590" y="346" font-size="14" font-weight="bold" text-anchor="middle" fill="#374151">Silver</text>
    <text x="590" y="366" font-size="11" text-anchor="middle" fill="#55606f">ADLS — cleansed</text>
  </g>

  <path d="M590,386 V411 H350 V436" fill="none" stroke="#5b6570" stroke-width="2" marker-end="url(#po-arrow)"/>

  <!-- Row 3: star schema -->
  <g class="dp-node" data-href="data-layers.md#why-a-star-schema-not-marts-built-directly-from-staging">
    <title>Dimensions, facts and marts — the star schema. Intermediate (int_) models run here too but never leave the DuckDB file. See "Why a star schema".</title>
    <rect x="250" y="436" width="200" height="70" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
    <text x="350" y="466" font-size="14" font-weight="bold" text-anchor="middle" fill="#0d47a1">dbt Core + DuckDB</text>
    <text x="350" y="486" font-size="11" text-anchor="middle" fill="#1565c0">int_ · dim_ · fct_ · mart_</text>
  </g>

  <line x1="450" y1="471" x2="500" y2="471" stroke="#5b6570" stroke-width="2" marker-end="url(#po-arrow)"/>

  <g class="dp-node" data-href="data-layers.md#the-two-axes">
    <title>Gold: the modeled, consumed product — the source of truth for dimensions and facts. See "The two axes".</title>
    <rect x="500" y="436" width="180" height="70" rx="6" fill="#fdf6d8" stroke="#d4af00" stroke-width="1.5"/>
    <text x="590" y="466" font-size="14" font-weight="bold" text-anchor="middle" fill="#6b5300">Gold</text>
    <text x="590" y="486" font-size="11" text-anchor="middle" fill="#8a6e00">ADLS — star schema</text>
  </g>

  <line x1="680" y1="471" x2="730" y2="471" stroke="#5b6570" stroke-width="2" marker-end="url(#po-arrow)"/>

  <!-- Right column: semantic layer and consumption -->
  <g class="dp-node" data-href="metric-definitions.md">
    <title>Each business metric (e.g. revenue) is defined once, in a mart_ model on top of the Gold star schema — not in MetricFlow, which Metabase cannot query through (ADR 0015). See "Metric definitions".</title>
    <rect x="730" y="436" width="180" height="70" rx="6" fill="#fee2e2" stroke="#ee4631" stroke-width="1.5"/>
    <text x="820" y="466" font-size="14" font-weight="bold" text-anchor="middle" fill="#991b1b">mart_ models</text>
    <text x="820" y="486" font-size="11" text-anchor="middle" fill="#b91c1c">metric definitions</text>
  </g>

  <line x1="820" y1="506" x2="820" y2="556" stroke="#5b6570" stroke-width="2" marker-end="url(#po-arrow)"/>

  <g class="dp-node" data-href="https://github.com/picot-data/data-platform-standards/blob/main/adr/0008-metabase-not-power-bi.md">
    <title>Metabase: open-source, self-hosted, queries the Gold layer through DuckDB. See ADR 0008 for why Power BI is not the BI tool here.</title>
    <rect x="730" y="556" width="180" height="70" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="820" y="586" font-size="14" font-weight="bold" text-anchor="middle" fill="#14532d">Metabase</text>
    <text x="820" y="606" font-size="11" text-anchor="middle" fill="#166534">consumption</text>
  </g>

  <!-- Metadata feed from dbt to its own documentation site -->
  <path d="M250,351 H140 V556" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#po-arrow-meta)"/>
  <path d="M250,471 H140" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="5,4"/>

  <g class="dp-node" data-href="platform-overview.md#governance-dbt-docs">
    <title>dbt docs is the catalog: every model and column with its description, the compiled SQL, the tests, and a lineage graph derived from ref() rather than declared. A static site generated by the pipeline, not a service to run. See "Governance — dbt docs" and ADR 0021.</title>
    <rect x="40" y="556" width="640" height="70" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="360" y="586" font-size="14" font-weight="bold" text-anchor="middle" fill="#134e4a">dbt docs — catalog and lineage</text>
    <text x="360" y="606" font-size="11" text-anchor="middle" fill="#0f766e">a static site generated by the pipeline, not a service · lineage derived from ref(), not declared</text>
  </g>

  <!-- Legend -->
  <rect x="40" y="656" width="870" height="140" rx="6" fill="#fafafa" stroke="#e5e7eb"/>

  <rect x="58" y="670" width="16" height="16" fill="#f2ddc4" stroke="#a5691f"/>
  <text x="82" y="683" font-size="11" fill="#333">Bronze — raw, immutable</text>
  <rect x="290" y="670" width="16" height="16" fill="#e6e9ed" stroke="#8a94a3"/>
  <text x="314" y="683" font-size="11" fill="#333">Silver — cleansed (stg_)</text>
  <rect x="540" y="670" width="16" height="16" fill="#fdf6d8" stroke="#d4af00"/>
  <text x="564" y="683" font-size="11" fill="#333">Gold — star schema (dim_ / fct_ / mart_)</text>

  <line x1="58" y1="708" x2="94" y2="708" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#po-arrow-meta)"/>
  <text x="104" y="712" font-size="11" fill="#333">metadata feed — dbt manifest.json / catalog.json, not the data itself</text>

  <text x="58" y="736" font-size="11" fill="#333">The dashed purple boundary is what Dagster orchestrates on the VM: dbt, and the non-SAP ingestion scripts.</text>
  <text x="58" y="758" font-size="11" fill="#333">int_ models have no box of their own here — they never leave the DuckDB file on the VM (see ADR 0001).</text>
  <text x="58" y="780" font-size="11" fill="#333">SAP ingestion sits outside that boundary: Azure Data Factory is managed and self-scheduled, not on the VM. Fallback: the existing ABAP script (ADR 0010).</text>
</svg>
