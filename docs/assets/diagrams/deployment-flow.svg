<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 870" font-family="Segoe UI, Arial, sans-serif" class="dp-diagram" role="img" aria-label="How a merge reaches the entity VM: GitHub Actions obtains a short-lived Azure token via OIDC, pushes the image to the shared container registry, waits for approval on the production environment, then asks Azure Run Command to have the VM's guest agent pull the image with its own managed identity and restart the stack. No inbound port and no stored secret.">

  <rect width="1000" height="870" fill="#ffffff"/>

  <defs>
    <marker id="dep-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L9,5.5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="dep-arrow-token" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L9,5.5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="dep-arrow-gate" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L9,5.5 L0,10 z" fill="#ee4631"/>
    </marker>
    <marker id="dep-arrow-vm" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,5 L0,9 z" fill="#66bb6a"/>
    </marker>
  </defs>

  <text x="500" y="30" font-size="19" font-weight="bold" text-anchor="middle" fill="#003f5c">Deployment — who asks what of whom</text>
  <text x="500" y="52" font-size="11.5" text-anchor="middle" fill="#666">From a merge on main to the platform running on the entity VM. No inbound port, no stored secret.</text>

  <!-- ============================ SHARED REGISTRY (right column) ============================ -->
  <g class="dp-node" data-href="https://github.com/picot-data/data-platform-standards/blob/main/adr/0012-oidc-run-command-deployment.md">
    <title>crpicotdata — one Azure Container Registry for the whole group. Chosen over GHCR because a VM can pull from it with its own managed identity, which is what removes the stored pull token (ADR 0012).</title>
    <rect x="800" y="110" width="175" height="190" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="887" y="140" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#4c1d95">Azure Container</text>
    <text x="887" y="156" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#4c1d95">Registry</text>
    <text x="887" y="180" font-size="10.5" text-anchor="middle" fill="#6d28d9">crpicotdata</text>
    <line x1="820" y1="196" x2="955" y2="196" stroke="#c4b5fd"/>
    <text x="887" y="216" font-size="9" text-anchor="middle" fill="#6d28d9">shared by every entity</text>
    <text x="887" y="232" font-size="9" text-anchor="middle" fill="#6d28d9">— one image, one</text>
    <text x="887" y="246" font-size="9" text-anchor="middle" fill="#6d28d9">registry, many VMs</text>
    <text x="887" y="272" font-size="9" text-anchor="middle" fill="#888">tags are immutable</text>
    <text x="887" y="286" font-size="9" text-anchor="middle" fill="#888">sha-&lt;commit&gt;, never :latest</text>
  </g>

  <!-- ============================ BAND 1 — BUILD ============================ -->
  <rect x="20" y="68" width="760" height="228" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="40" y="92" font-size="13" font-weight="bold" fill="#555">1 — Build and publish the image <tspan font-weight="normal" fill="#888">(the VM is not involved)</tspan></text>

  <g class="dp-node" data-href="repositories-and-delivery.md#deployment">
    <title>Runs on a GitHub-hosted runner. Builds the platform image from the entity repo and tags it with the commit sha.</title>
    <rect x="45" y="112" width="200" height="66" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
    <text x="145" y="138" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0d47a1">Build job</text>
    <text x="145" y="156" font-size="9.5" text-anchor="middle" fill="#1565c0">GitHub-hosted runner</text>
    <text x="145" y="170" font-size="9.5" text-anchor="middle" fill="#1565c0">docker build</text>
  </g>

  <g class="dp-node" data-href="https://github.com/picot-data/data-platform-standards/blob/main/adr/0012-oidc-run-command-deployment.md">
    <title>Microsoft Entra ID checks the workflow's signed OIDC token against the federated credential, then issues a short-lived Azure token. Nothing is stored on either side.</title>
    <rect x="390" y="106" width="225" height="78" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="502" y="132" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#4c1d95">Microsoft Entra ID</text>
    <text x="502" y="150" font-size="9.5" text-anchor="middle" fill="#6d28d9">workload identity federation</text>
    <text x="502" y="170" font-size="9" text-anchor="middle" fill="#059669">no secret is stored in GitHub</text>
  </g>

  <path d="M245,124 H385" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#dep-arrow)"/>
  <text x="315" y="118" font-size="9" text-anchor="middle" fill="#6d28d9">② signed OIDC token</text>

  <path d="M385,166 H250" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#dep-arrow-token)"/>
  <text x="317" y="180" font-size="9" text-anchor="middle" fill="#047857">③ short-lived Azure token</text>

  <text x="145" y="105" font-size="9" text-anchor="middle" fill="#888">① merge to main</text>

  <path d="M145,178 V256 H795" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#dep-arrow)"/>
  <text x="410" y="249" font-size="9.5" text-anchor="middle" fill="#6d28d9">④ docker push crpicotdata/platform:sha-&lt;commit&gt;</text>

  <text x="40" y="285" font-size="9.5" font-style="italic" fill="#888">One image for the whole group — the same code runs for every entity; only the configuration differs.</text>

  <!-- ============================ BAND 2 — GATE ============================ -->
  <path d="M400,296 V332" fill="none" stroke="#ee4631" stroke-width="1.5" marker-end="url(#dep-arrow-gate)"/>

  <rect x="20" y="308" width="760" height="92" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="40" y="330" font-size="13" font-weight="bold" fill="#555">2 — Approval gate</text>

  <g class="dp-node" data-href="https://github.com/picot-data/data-platform-standards/blob/main/adr/0012-oidc-run-command-deployment.md">
    <title>The only control that does not depend on the laptop holding the GitHub credentials: a stolen token can push to main, it cannot click Approve. And because the federated credential's subject is bound to this environment, Azure itself refuses a token to a run that skipped it.</title>
    <rect x="120" y="338" width="560" height="54" rx="6" fill="#fee2e2" stroke="#ee4631" stroke-width="1.8"/>
    <text x="400" y="360" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#991b1b">GitHub Environment “production” — required reviewer</text>
    <text x="400" y="379" font-size="9.5" text-anchor="middle" fill="#991b1b">the OIDC subject is bound to this environment, so Azure refuses a token to any run that skipped it</text>
  </g>

  <!-- ============================ BAND 3 — DEPLOY ============================ -->
  <rect x="20" y="412" width="760" height="440" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="40" y="436" font-size="13" font-weight="bold" fill="#555">3 — Deploy <tspan font-weight="normal" fill="#888">(control plane only — no port is opened, and nothing of GitHub's runs on the VM)</tspan></text>

  <g class="dp-node" data-href="repositories-and-delivery.md#deployment">
    <title>Also a GitHub-hosted runner. It never connects to the VM: it asks Azure to carry the deployment out.</title>
    <rect x="45" y="452" width="200" height="66" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
    <text x="145" y="478" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0d47a1">Deploy job</text>
    <text x="145" y="496" font-size="9.5" text-anchor="middle" fill="#1565c0">GitHub-hosted runner</text>
    <text x="145" y="510" font-size="9.5" text-anchor="middle" fill="#1565c0">never touches the VM directly</text>
  </g>

  <rect x="45" y="534" width="200" height="46" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="145" y="553" font-size="9" text-anchor="middle" fill="#047857">its own Azure token, from the</text>
  <text x="145" y="568" font-size="9" text-anchor="middle" fill="#047857">same exchange as ② – ③</text>

  <text x="45" y="616" font-size="10" font-weight="bold" fill="#92400e">Deliberately absent</text>
  <text x="45" y="636" font-size="9.5" fill="#92400e">• no SSH from GitHub to the VM</text>
  <text x="45" y="653" font-size="9.5" fill="#92400e">• no GitHub agent on the VM</text>
  <text x="45" y="670" font-size="9.5" fill="#92400e">• no registry token on the VM</text>
  <text x="45" y="687" font-size="9.5" fill="#92400e">• no inbound port opened</text>
  <text x="45" y="704" font-size="9.5" fill="#92400e">• no Azure secret in GitHub</text>

  <g class="dp-node" data-href="https://github.com/picot-data/data-platform-standards/blob/main/adr/0012-oidc-run-command-deployment.md">
    <title>Azure Resource Manager relays the deployment script to the VM's guest agent over the control plane. The role granted to GitHub is a custom one limited to the runCommand action — never Virtual Machine Contributor, which could delete the VM.</title>
    <rect x="380" y="452" width="210" height="66" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="485" y="476" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#4c1d95">Azure Resource Manager</text>
    <text x="485" y="493" font-size="9.5" text-anchor="middle" fill="#6d28d9">Run Command</text>
    <text x="485" y="508" font-size="9" text-anchor="middle" fill="#6d28d9">custom role: runCommand only</text>
  </g>

  <path d="M245,478 H375" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#dep-arrow)"/>
  <text x="310" y="470" font-size="8.5" text-anchor="middle" fill="#6d28d9">⑤ az vm run-command invoke</text>

  <path d="M485,518 V596" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#dep-arrow)"/>
  <text x="497" y="546" font-size="9" fill="#6d28d9">⑥ the guest agent runs the</text>
  <text x="497" y="560" font-size="9" fill="#6d28d9">script — the VM accepts no</text>
  <text x="497" y="574" font-size="9" fill="#6d28d9">connection from outside</text>

  <g class="dp-node" data-href="platform-overview.md">
    <title>One VM per entity (ADR 0006). It holds no repository checkout and no credential: the script arrives from Azure, and the image is pulled with the VM's own managed identity.</title>
    <rect x="300" y="600" width="460" height="240" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="530" y="626" font-size="12" font-weight="bold" text-anchor="middle" fill="#1b5e20">vm-picot-&lt;entity&gt;-data-weu-01</text>

    <rect x="320" y="642" width="195" height="44" rx="5" fill="#ffffff" stroke="#66bb6a"/>
    <text x="417" y="662" font-size="9.5" text-anchor="middle" fill="#1b5e20">Azure guest agent</text>
    <text x="417" y="676" font-size="8.5" text-anchor="middle" fill="#388e3c">receives the script</text>

    <rect x="545" y="642" width="195" height="44" rx="5" fill="#ffffff" stroke="#66bb6a"/>
    <text x="642" y="662" font-size="9.5" text-anchor="middle" fill="#1b5e20">docker compose up -d</text>
    <text x="642" y="676" font-size="8.5" text-anchor="middle" fill="#388e3c">image tag passed in as a parameter</text>

    <path d="M515,664 H540" fill="none" stroke="#66bb6a" stroke-width="1.3" marker-end="url(#dep-arrow-vm)"/>

    <rect x="320" y="704" width="195" height="42" rx="5" fill="#ffffff" stroke="#66bb6a"/>
    <text x="417" y="730" font-size="9.5" text-anchor="middle" fill="#1b5e20">dagster-webserver</text>

    <rect x="545" y="704" width="195" height="42" rx="5" fill="#ffffff" stroke="#66bb6a"/>
    <text x="642" y="730" font-size="9.5" text-anchor="middle" fill="#1b5e20">dagster-daemon</text>

    <text x="530" y="774" font-size="9" text-anchor="middle" fill="#33691e">green only once /server_info answers — “containers created” is not “platform working”</text>
    <text x="530" y="792" font-size="9" text-anchor="middle" fill="#33691e">UI on 127.0.0.1:3000 only, reached through an SSH tunnel — never published</text>
    <text x="530" y="820" font-size="9" text-anchor="middle" fill="#388e3c">authenticates to ADLS with the same managed identity — no credential on disk</text>
  </g>

  <path d="M760,660 H838 V306" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#dep-arrow)"/>
  <text x="790" y="690" font-size="9" fill="#6d28d9">⑦ the VM pulls the image</text>
  <text x="790" y="704" font-size="9" fill="#6d28d9">with its own managed</text>
  <text x="790" y="718" font-size="9" fill="#6d28d9">identity (AcrPull role)</text>
  <text x="790" y="736" font-size="9" font-weight="bold" fill="#047857">no token stored</text>
  <text x="790" y="750" font-size="9" font-weight="bold" fill="#047857">anywhere on the VM</text>

  <text x="40" y="864" font-size="9.5" font-style="italic" fill="#888">Purple = an authenticated request. Green dashed = a short-lived token returned. Every arrow starts outside the VM and ends at Azure — none of them reaches the VM inbound.</text>
</svg>
