site_name: Picot Data Platform Standards
site_description: Group-wide data platform standards, conventions and architecture decisions
repo_url: https://github.com/picot-data/data-platform-standards
repo_name: picot-data/data-platform-standards
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    # navigation.instant is incompatible with mkdocs-static-i18n's language
    # switcher (see the plugin's own build warning) — dropped when i18n was
    # added rather than kept and fighting the warning in strict mode.
    - navigation.tracking
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.action.edit

# Grouped in the navigation only -- the files stay flat in docs/, so every URL
# published so far keeps working. Entity repositories link to
# /naming-conventions/, and moving the file into a dbt/ directory would break
# those links for no gain.
#
# NAMING CONVENTIONS STAYS AT THE TOP LEVEL, deliberately. It is not a dbt page:
# it also carries the ADLS path layout, the cross-cutting lexical rules
# (snake_case, English, abbreviations), and pointers to the BI and git naming
# rules that live on their own pages. Filing it under a tool would be the same
# mistake as filing the glossary under one.
#
# The section is named after the task rather than after dbt. dbt is the only
# transformation tool on the platform, so naming it adds nothing, and what the
# section actually describes is the life of one model: which layer it belongs
# to, where the file goes, how it is documented, how it is tested, how a metric
# on it is defined. The order of the entries is the order of that work.
nav:
  - Home: index.md
  - Platform overview: platform-overview.md
  - Naming conventions: naming-conventions.md
  - Building a data model:
      - Data layers: data-layers.md
      - dbt project structure: project-structure.md
      - Writing descriptions: writing-descriptions.md
      - Testing: testing.md
      - Metric definitions: metric-definitions.md
  - BI and access: bi-and-access.md
  - Azure landing zones: azure-landing-zones.md
  - Repositories and delivery: repositories-and-delivery.md
  - Onboarding a new entity: onboarding-a-new-entity.md
  - Onboarding a data engineer: onboarding-a-data-engineer.md
  - Onboarding a data analyst: onboarding-a-data-analyst.md
  - Glossary: glossary.md
  - Architecture Decision Records: adr-index.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences

plugins:
  - search
  # Renaming a file changes its published URL, and entity repositories and
  # external documents link to those URLs. Each rename leaves a stub at the old
  # address here instead of a 404.
  - redirects:
      redirect_maps:
        # The filename said "semantic layer"; the page says the platform runs
        # none (ADR 0015). Renamed to match its own H1.
        semantic-layer.md: metric-definitions.md
        # Renamed for symmetry, once a sibling analyst page existed.
        onboarding-an-engineer.md: onboarding-a-data-engineer.md
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            Platform overview: Vue d'ensemble de la plateforme
            Data layers: Couches de données
            Metric definitions: Définition des indicateurs
            BI and access: BI et accès
            Building a data model: Construire un modèle de données
            Naming conventions: Conventions de nommage
            dbt project structure: Structure d'un projet dbt
            Writing descriptions: Rédiger les descriptions
            Testing: Tests
            Azure landing zones: Landing zones Azure
            Repositories and delivery: Dépôts et livraison
            Onboarding a new entity: Intégrer une nouvelle entité
            Onboarding a data engineer: Intégrer un ingénieur data
            Onboarding a data analyst: Intégrer un analyste de données
            Glossary: Glossaire
            Architecture Decision Records: Décisions d'architecture (ADR)
        - locale: nl
          name: Nederlands
          build: true
          nav_translations:
            Home: Home
            Platform overview: Platformoverzicht
            Data layers: Datalagen
            Metric definitions: Metriekdefinities
            BI and access: BI en toegang
            Building a data model: Een datamodel bouwen
            Naming conventions: Naamgevingsconventies
            dbt project structure: Structuur van een dbt-project
            Writing descriptions: Beschrijvingen schrijven
            Testing: Testen
            Azure landing zones: Azure landing zones
            Repositories and delivery: Repository's en levering
            Onboarding a new entity: Een nieuwe entiteit onboarden
            Onboarding a data engineer: Een data-engineer onboarden
            Onboarding a data analyst: Een data-analist onboarden
            Glossary: Woordenlijst
            Architecture Decision Records: Architectuurbeslissingen (ADR)

extra_css:
  - assets/theme-picot.css
  - assets/diagrams.css

extra_javascript:
  - assets/diagrams.js
