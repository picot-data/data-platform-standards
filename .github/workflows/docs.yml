name: Build and deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but never cancel one that is already
# running: a cancelled Pages deployment leaves the environment busy and makes
# the next run fail with "Deployment cancelled".
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Initialises Pages for Actions-based deployment. Without this step the
      # deployment can be accepted and then never complete.
      - uses: actions/configure-pages@v5
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
