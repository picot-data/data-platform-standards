name: Build and deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # deploy-pages@v4 reads the build job's artifact through the Actions API.
  # This block is restrictive, so without an explicit grant the token gets
  # "actions: none" and the lookup comes back empty ("Found 0 artifact(s)").
  actions: read

# Allow only one concurrent deployment, but never cancel one that is already
# running: a cancelled Pages deployment leaves the environment busy and makes
# the next run fail with "Deployment cancelled".
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Initialises Pages for Actions-based deployment. Without this step the
      # deployment can be accepted and then never complete.
      - uses: actions/configure-pages@v5
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      # Content-addressed cache of past translations (keyed on a hash of each
      # English source file — see scripts/translate_docs.py), so a page that
      # hasn't changed since the last run is restored here instead of
      # spending a Swiftask call on it. The save key never matches on restore
      # (it embeds the current tree's hash), so restore-keys falls back to
      # the most recent cache and this step always saves a new one on top.
      - uses: actions/cache@v4
        with:
          path: .translation-cache
          key: translation-cache-${{ hashFiles('docs/**/*.md') }}
          restore-keys: |
            translation-cache-
      # Regenerates docs/*.fr.md and docs/*.nl.md from the current English
      # docs/*.md on every deploy — never hand-edited, so the translations
      # cannot desync from the English source. See scripts/translate_docs.py.
      - run: uv run python scripts/translate_docs.py
        env:
          SWIFTASK_API_KEY: ${{ secrets.SWIFTASK_API_KEY }}
          # Repo variable, not a secret — the model name isn't sensitive.
          # Falls back to claude-haiku-4-5 if the variable isn't set.
          SWIFTASK_MODEL: ${{ vars.SWIFTASK_MODEL || 'claude-haiku-4-5' }}
      - run: uv run mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # If this job ever fails, re-run the *whole* workflow rather than using
      # "Re-run failed jobs": artifacts are scoped to a single run attempt, so
      # replaying the deploy job alone cannot see the artifact that the build
      # job uploaded on the previous attempt.
      - id: deployment
        uses: actions/deploy-pages@v4
